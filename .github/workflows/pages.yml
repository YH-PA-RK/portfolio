name: Import and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF library for the initial copy
        if: ${{ hashFiles('index.html') == '' }}
        run: python -m pip install 'PyMuPDF==1.26.6' 'pypdf==6.10.0'
      - name: Import once and validate local links
        run: python scripts/import_portfolio.py
      - name: Save imported website files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html activities cv assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Import independent website files with portfolio URLs [skip ci]'
            git push
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
